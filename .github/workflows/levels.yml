name: Gunluk seviyeler

# Her 2 saatte bir (UTC çift saatler = TSİ 01,03,05...,23)
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  send-levels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deposu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Seviyeleri hesapla ve Telegram'a gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python levels_bot.py
